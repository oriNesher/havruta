<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Turn your goals into a competition with friends. Set a target, invite people, and race each other to it.">
  <meta name="theme-color" content="#0F0F17">

  <!-- Link-preview cards (the app root, not the /i/ invite landing page,
       which renders its own per-invite OG tags from the Cloud Function). -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Havruta">
  <meta property="og:description" content="Turn your goals into a competition with friends. Set a target, invite people, and race each other to it.">
  <meta property="og:image" content="icons/Icon-512.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Havruta">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Havruta</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Matches AppTheme's backgroundColor (0xFF0F0F17) so there is no white
       flash between the browser painting the document and Flutter painting
       its first frame — main.dart.js is a multi-MB download on a cold load. */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #0F0F17;
      overflow: hidden;
    }

    #splash {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 24px;
      background-color: #0F0F17;
      transition: opacity 250ms ease-out;
      z-index: 1;
    }

    #splash.hidden {
      opacity: 0;
      pointer-events: none;
    }

    #splash img {
      width: 96px;
      height: 96px;
      border-radius: 24px;
    }

    #splash .bar {
      width: 140px;
      height: 3px;
      border-radius: 999px;
      background-color: #2A2A42;
      overflow: hidden;
    }

    #splash .bar::after {
      content: "";
      display: block;
      width: 40%;
      height: 100%;
      border-radius: 999px;
      background-color: #8B5CF6;
      animation: slide 1.1s ease-in-out infinite;
    }

    @keyframes slide {
      0%   { transform: translateX(-100%); }
      100% { transform: translateX(350%); }
    }

    @media (prefers-reduced-motion: reduce) {
      #splash .bar::after { animation: none; width: 100%; }
      #splash { transition: none; }
    }
  </style>
</head>
<body>
  <div id="splash">
    <img src="icons/Icon-192.png" alt="Havruta">
    <div class="bar"></div>
  </div>

  <script>
    function hideSplash() {
      var splash = document.getElementById('splash');
      if (!splash || splash.classList.contains('hidden')) return;
      splash.classList.add('hidden');
      splash.addEventListener('transitionend', function () {
        splash.remove();
      });
    }

    // Flutter dispatches this on window once it has painted its first frame.
    window.addEventListener('flutter-first-frame', hideSplash);

    // Safety net against the event above never firing, which would leave a
    // permanent loading bar over a working app. Deliberately far longer than
    // any real load: tripping it early is worse than useless, since it just
    // swaps the loading bar for a blank canvas the app hasn't painted yet.
    // A slow connection pulling main.dart.js, and any debug build, must both
    // finish well inside this.
    setTimeout(hideSplash, 45000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
