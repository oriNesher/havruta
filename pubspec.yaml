name: havruta
description: "Havruta: turn personal goals into social challenges with friends."
publish_to: 'none'

# build-name (before the +) is versionName / CFBundleShortVersionString;
# build-number (after the +) is versionCode / CFBundleVersion.
version: 1.7.0+11

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^4.5.0
  firebase_auth: ^6.2.0
  cloud_firestore: ^6.1.3
  cloud_functions: ^6.1.3
  firebase_messaging: ^16.1.2
  marquee: ^2.2.3
  google_fonts: ^6.2.1
  phosphor_flutter: ^2.1.0
  share_plus: ^11.0.0
  app_links: ^6.3.3
  shared_preferences: ^2.3.3
  # Browser APIs (Blob download, history.replaceState) used only by the
  # web-side conditional import in lib/services/platform_web_impl.dart.
  web: ^1.1.1
  flutter_timezone: ^5.1.1
  timezone: ^0.11.1
  google_sign_in: ^7.2.0
  flutter_facebook_auth: ^7.3.2
  crypto: ^3.0.8
  # Imported directly (web_only.dart) by lib/auth/google_web_button_web.dart.
  google_sign_in_web: ^1.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
